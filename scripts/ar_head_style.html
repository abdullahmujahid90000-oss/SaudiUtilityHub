<style>
    :root {
      --primary: #065a2d;
      --secondary: #0a7c3e;
      --accent: #c9a227;
      --gold-bright: #ffd166;
      --light: #f8fafc;
      --gray: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background-color: #fff;
    }
    header {
      background: #1a1a2e;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
    }
    .logo span { color: var(--gold-bright); }
    nav ul {
      display: flex;
      list-style: none;
      gap: 1.25rem;
    }
    nav a {
      text-decoration: none;
      color: rgba(255,255,255,0.82);
      font-weight: 500;
      font-size: 0.95rem;
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
      transition: color 0.15s;
    }
    nav a:hover, nav a.active {
      color: #fff;
      border-bottom-color: var(--gold-bright);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .breadcrumb {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      color: var(--gray);
      font-size: 0.9rem;
    }
    .breadcrumb a {
      color: var(--secondary);
      text-decoration: none;
    }
    .hero {
      margin-bottom: 2rem;
    }
    .hero h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }
    .hero p {
      font-size: 1.125rem;
      color: var(--gray);
      margin-bottom: 1rem;
    }
    .badge {
      display: inline-block;
      background: #dbeafe;
      color: var(--secondary);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .quick-answer {
      background: #f0fdf4;
      border-left: 4px solid var(--success);
      padding: 1.25rem;
      margin: 2rem 0;
      font-weight: 600;
      border-radius: 0 0.5rem 0.5rem 0;
    }
    .estimator-notice {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 0.5rem;
      padding: 1rem 1.25rem;
      margin: 1rem 0 2rem;
      font-size: 0.9rem;
      color: #664d03;
    }
    .calculator-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem;
      margin: 2rem 0;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--primary);
    }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      font-size: 1rem;
    }
    input[aria-invalid="true"] {
      border-color: var(--danger);
      outline-color: var(--danger);
    }
    .note {
      font-size: 0.875rem;
      color: var(--gray);
      margin-top: 0.5rem;
    }
    .field-error {
      display: none;
      font-size: 0.85rem;
      color: var(--danger);
      margin-top: 0.4rem;
      font-weight: 600;
    }
    .field-error.visible { display: block; }
    .form-error-summary {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
      padding: 0.85rem 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1.25rem;
      font-weight: 600;
    }
    .form-error-summary.visible { display: block; }
    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--gray);
    }
    .results {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #f8fafc;
      border-radius: 1rem;
      display: none;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.6rem;
      font-size: 1.02rem;
    }
    .result-subhead {
      font-weight: 700;
      color: var(--secondary);
      margin: 1rem 0 0.5rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .result-total {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.2rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .verify-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
      margin: 1.5rem 0 2.5rem;
      font-size: 0.95rem;
    }
    .verify-box a { color: var(--secondary); font-weight: 700; }
    .scope-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
      margin: 1.5rem 0;
      font-size: 0.95rem;
    }
    h2 {
      font-size: 1.875rem;
      margin: 2.5rem 0 1.5rem;
      color: var(--primary);
    }
    h3 {
      font-size: 1.375rem;
      margin: 2rem 0 1rem;
      color: var(--secondary);
    }
    ol, ul {
      margin-left: 1.5rem;
      margin-bottom: 1.5rem;
    }
    li {
      margin-bottom: 0.5rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }
    th, td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #f1f5f9;
      font-weight: 600;
    }
    .cite {
      color: var(--secondary);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85em;
    }
    .cite:hover { text-decoration: underline; }
    .source-list {
      list-style: none;
      margin-left: 0;
      font-size: 0.95rem;
    }
    .source-list li { margin-bottom: 0.75rem; }
    footer {
      background: var(--primary);
      color: white;
      padding: 3rem 1.5rem 1.5rem;
      margin-top: 3rem;
    }
    .footer-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }
    .footer-col h3 {
      color: white;
      margin-bottom: 1.25rem;
      font-size: 1.125rem;
    }
    .footer-col ul {
      list-style: none;
      margin-left: 0;
    }
    .footer-col a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .footer-col a:hover {
      color: white;
    }
    .copyright {
      text-align: center;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin: 1.5rem 0 2.5rem;
    }
    .related-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
    .related-card h3 {
      margin: 0 0 0.5rem;
      font-size: 1.05rem;
      color: var(--primary);
    }
    .related-card p {
      color: var(--gray);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    .related-card a {
      color: var(--secondary);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .header-inner { flex-direction: column; gap: 1rem; }
      nav ul { flex-wrap: wrap; justify-content: center; }
      .hero h1 { font-size: 1.75rem; }
      .btn-group { flex-direction: column; }
    }
  </style>

<style>
  body { font-family: 'Tajawal','Segoe UI',Tahoma,Arial,sans-serif; direction: rtl; }
  .quick-answer { border-left: none; border-right: 4px solid var(--success); border-radius: .5rem 0 0 .5rem; }
  ol, ul { margin-left: 0; margin-right: 1.5rem; }
  .footer-col ul, .source-list { margin-right: 0; }
  th, td { text-align: right; }
  .lang-switch { display:inline-block; margin-bottom:1rem; font-weight:600; color:var(--secondary); text-decoration:none; }
</style>
